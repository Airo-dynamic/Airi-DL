[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "airidl"
version = "0.1.0.dev1"
description = "A hand-reproducible ML systems learning laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{name = "Airi-DL contributors"}]
dependencies = []

[project.scripts]
airidl = "airidl.cli:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "ninja==1.13.0",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.uv]
required-version = "==0.12.6"
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/airidl"]

[tool.hatch.build.targets.wheel.force-include]
"env/versions.toml" = "airidl/versions.toml"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
